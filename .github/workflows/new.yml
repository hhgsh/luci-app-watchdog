name: Build apk
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'luci-app-watchdog/**'

jobs:
  build:
    name: Build x86_64 for OpenWrt 25.12
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Tag Name (Version + Time)
        id: vars
        run: |
          # 从 Makefile 提取版本号 (位于 luci-app-watchdog/Makefile)
          VERSION=$(grep -oP '^PKG_VERSION:=\s*\K.*' luci-app-watchdog/Makefile)
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          
          # 获取当前时间 (格式: 年月日时分，例如 202609301430)
          TIME=$(date +"%Y%m%d%H%M")
          
          # 拼接 Tag，例如 v1.0.8-202609301430
          TAG_NAME="v${VERSION}-${TIME}"
          
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Tag name will be: $TAG_NAME"

      - name: Build packages
        uses: sirpdboy/gh-action-sdk@main
        env:
          ARCH: x86_64-openwrt-25.12
          FEEDNAME: packages_ci
          PACKAGES: luci-app-watchdog
          NO_REFRESH_CHECK: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-openwrt-25.12
          path: bin/packages/x86_64/packages_ci/*.apk

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.TAG_NAME }}
          tag: ${{ env.TAG_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          # 直接上传 apk 产物，省去解压步骤
          artifacts: "bin/packages/x86_64/packages_ci/*.apk"
