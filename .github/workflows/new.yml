name: Build 25.12

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'luci-app-watchdog/**'

# 赋予 GITHUB_TOKEN 创建和修改 Release 的权限
permissions:
  contents: write

jobs:
  build:
    name: Build x86_64 for OpenWrt 25.12
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Tag Name (Version + Time)
        id: vars
        run: |
          # 从 Makefile 中提取 PKG_VERSION
          VERSION=$(grep -oP '^PKG_VERSION:=\s*\K.*' luci-app-watchdog/Makefile 2>/dev/null || echo "1.0.0")
          
          # 生成时间戳 (格式: 年月日时分)
          TIME=$(date +"%Y%m%d%H%M")
          
          TAG_NAME="v${VERSION}-${TIME}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Tag name will be: $TAG_NAME"

      - name: Build packages
        uses: sirpdboy/gh-action-sdk@main
        env:
          ARCH: x86_64-openwrt-25.12
          FEEDNAME: packages_ci
          PACKAGES: luci-app-watchdog
          NO_REFRESH_CHECK: true

      - name: Collect target APK only
        run: |
          # 创建独立的输出目录，仅复制 watchdog 相关的 .apk 产物
          mkdir -p dist
          find bin/packages/x86_64/packages_ci/ -type f -name "*watchdog*.apk" -exec cp {} dist/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-watchdog-x86_64-openwrt-25.12
          path: dist/*

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.TAG_NAME }}
          tag: ${{ env.TAG_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          artifacts: "dist/*"
